# Place this file at: .github/workflows/pacman.yml
# in your Parsa-Nasiri/Parsa-Nasiri profile repository.
#
# One-time setup after adding this file:
#   1. Settings -> Actions -> General -> Workflow permissions -> "Read and write permissions" -> Save
#   2. Actions tab -> "generate pacman game" -> Run workflow (manual trigger, first run)
#   3. It will then auto-refresh every 24h and push the SVG to the `output` branch,
#      which is exactly what the README's <picture> tag points to.

name: generate pacman game

on:
  schedule:
    - cron: "0 0 * * *"   # refresh once a day
  workflow_dispatch: {}    # allows manual "Run workflow" trigger
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
